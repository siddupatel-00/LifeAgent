<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Blue rounded square box exactly matching our website/app logo (#3b82f6) -->
  <rect width="512" height="512" rx="140" fill="#3b82f6" />
  <!-- White glowing Sparkles icon matching input_file_0.png -->
  <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main central 4-pointed star -->
    <path d="M256 120 C256 210, 210 256, 120 256 C210 256, 256 302, 256 392 C256 302, 302 256, 392 256 C302 256, 256 210, 256 120 Z" />
    <!-- Top-right plus (+) spark -->
    <line x1="384" y1="120" x2="384" y2="176" stroke-width="26" />
    <line x1="356" y1="148" x2="412" y2="148" stroke-width="26" />
    <!-- Bottom-left circle dot -->
    <circle cx="160" cy="360" r="22" stroke-width="26" />
  </g>
</svg>
