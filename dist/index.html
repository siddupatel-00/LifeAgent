    <script>
      (function() {
        try {

          var isSystemDark = false;
          try { if (typeof window !== 'undefined' && window.matchMedia) isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
          if (theme === 'dark' || (!theme && isSystemDark) || (theme === 'pc' && isSystemDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}

        window.hideSplash = function() {
          var splash = document.getElementById('initial-splash-loader');
          if (splash && splash.style.display !== 'none') {
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() { splash.style.display = 'none'; }, 400);
          }
        };

        // Guarantee splash loader auto-dismisses after 1.0s max
        setTimeout(function() {
          if (window.hideSplash) window.hideSplash();
        }, 1000);
      })();
